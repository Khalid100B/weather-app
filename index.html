<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=Short+Stack&display=swap" rel="stylesheet">
    <title>Weather App</title>
  </head>
  <body class="bg-[url('/src/imgs/bg-img.png')] backdrop-blur-xl text-white flex flex-col gap-y-10 items-center justify-center min-h-screen bg-cover bg-center w-full relative">
    <div class="absolute bg-black blur-xl opacity-15 top-0 right-0 left-0 bottom-0"></div>

    <!-- the placeholder -->
    <div id="input-container" class="container">
      <h1 class="text-gray-200 text-2xl font-poppins uppercase">Enter your location</h1>
      <form class="flex items-center justify-center border-red-300 relative" action="">
        <input id="cityInput" class="outline-none ease duration-150 focus:ring-2 focus:ring-zinc-500/80 border border-gray-600/40 min-w-100 h-12 rounded-full bg-zinc-800/10 px-5 caret-gray-300" placeholder="Search for a city" type="text">
        <button id="submit-btn" class="bg-sky-500 text-white px-3 py-1.5 rounded-full hover:bg-sky-600 transition-all ease duration-300 cursor-pointer active:bg-sky-500 absolute top-1 right-1 bottom-1" type="submit">Get Weather</button>
      </form>
      <div class="flex justify-around items-center gap-x-10 px-10">
        <img class="ml-5" src="/src/imgs/sky-cloud-svgrepo-com.png" width="150">
        <p class="w-45 text-lg font-short text-gray-200 text-left uppercase ml-2">Your personal weather dashboard</p>
      </div>
    </div>

        <!-- The main interface after fetching data -->
     <div id="weather-container" class=" bg-white/4 backdrop-blur-xl rounded-4xl w-150 shadow-2xl gap-y-5 z-10 flex item-center justify-between h-100 hidden!"></div>


  </body>
  <script type="module" src="/src/main.js"></script>
</html>
